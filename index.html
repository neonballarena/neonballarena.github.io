<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Ball Arena</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #07041a; --panel: #120a2b; --text: #e9e6ff; --muted: #a9a3cc; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; padding: 32px 16px; text-align: center; }
  img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 0 32px rgba(109, 68, 255, 0.45); }
  h1 { font-size: 32px; margin: 20px 0 8px; letter-spacing: 1px; }
  p { color: var(--muted); }
  nav { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  nav a { color: #fff; text-decoration: none; background: var(--panel); border: 1px solid #6d44ff; border-radius: 12px; padding: 10px 18px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Neon Ball Arena icon">
  <h1>NEON BALL ARENA</h1>
  <p>Put a flag or your own photo on a ball, tap the arena to push, and watch who survives.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:emrekisik@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
